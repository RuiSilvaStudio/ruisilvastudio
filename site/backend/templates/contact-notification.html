<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>New enquiry — {{subject}}</title></head>
<body style="margin:0;padding:0;background-color:#F1EEE7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1EEE7;"><tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FCFBF8;">
      <tr><td style="background-color:#141312;padding:32px 40px;" align="left"><span style="font-family:Helvetica,Arial,sans-serif;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#FCFBF8;font-weight:600;">New Enquiry</span></td></tr>
      <tr><td style="height:2px;background-color:#AE8C57;font-size:0;line-height:0;">&nbsp;</td></tr>
      <tr><td style="padding:40px;font-family:Helvetica,Arial,sans-serif;color:#1F1E1C;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
          <tr><td style="padding:10px 0;border-bottom:1px solid #E0DED6;color:#5A564E;width:90px;vertical-align:top;">Name</td><td style="padding:10px 0;border-bottom:1px solid #E0DED6;font-weight:600;">{{name}}</td></tr>
          <tr><td style="padding:10px 0;border-bottom:1px solid #E0DED6;color:#5A564E;vertical-align:top;">Email</td><td style="padding:10px 0;border-bottom:1px solid #E0DED6;"><a href="mailto:{{email}}" style="color:#AE8C57;">{{email}}</a></td></tr>
          <tr><td style="padding:10px 0;border-bottom:1px solid #E0DED6;color:#5A564E;vertical-align:top;">Subject</td><td style="padding:10px 0;border-bottom:1px solid #E0DED6;font-weight:600;">{{subject}}</td></tr>
        </table>
        <p style="margin:28px 0 8px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#AE8C57;">Message</p>
        <div style="font-size:15px;line-height:1.7;color:#1F1E1C;background-color:#FAF9F7;border-left:2px solid #AE8C57;padding:18px 20px;">{{message}}</div>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:32px;"><tr>
          <td style="background-color:#1F1E1C;"><a href="mailto:{{email}}?subject=Re:%20{{subject}}" style="display:inline-block;padding:13px 28px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#FCFBF8;text-decoration:none;font-weight:600;">Reply to {{name}}</a></td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:20px 40px;border-top:1px solid #E0DED6;font-family:Helvetica,Arial,sans-serif;">
        <p style="margin:0;font-size:11px;color:#A79E8A;">Sent from the contact form at ruisilvastudio.com</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
