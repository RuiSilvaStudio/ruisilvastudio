<!--
  Rui Silva Studio — transactional email base.
  Email-client-safe: table layout, inline CSS, system fonts only.
  Brand: ivory #FCFBF8, ink #1F1E1C, brass #AE8C57, night #141312.
  The {{...}} tokens are substituted by the edge function / Listmonk.
-->
<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{subject}}</title>
  <!--[if mso]><style>table{border-collapse:collapse}</style><![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#F1EEE7;">
  <div style="display:none;max-height:0;overflow:hidden;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1EEE7;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FCFBF8;">

          <!-- Header -->
          <tr>
            <td style="background-color:#141312;padding:32px 40px;" align="left">
              <span style="font-family:Helvetica,Arial,sans-serif;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#FCFBF8;font-weight:600;">Rui Silva Studio</span>
            </td>
          </tr>
          <tr><td style="height:2px;background-color:#AE8C57;font-size:0;line-height:0;">&nbsp;</td></tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 40px 40px;font-family:Helvetica,Arial,sans-serif;color:#1F1E1C;">
              {{body}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:28px 40px;border-top:1px solid #E0DED6;font-family:Helvetica,Arial,sans-serif;">
              <p style="margin:0;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#AE8C57;">Furniture as Cultural Infrastructure</p>
              <p style="margin:12px 0 0;font-size:12px;line-height:1.6;color:#5A564E;">
                Rua Rio Ave, 1970 · Prazins (Santa Eufémia) · 4800-615 Guimarães · Portugal<br />
                <a href="mailto:rui.silva@ruisilvastudio.com" style="color:#1F1E1C;text-decoration:none;">rui.silva@ruisilvastudio.com</a>
              </p>
              <p style="margin:16px 0 0;font-size:11px;line-height:1.6;color:#A79E8A;">
                {{footer_note}}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
